<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Survival Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #gameCanvas {
            display: block;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
        }
        .btn {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background-color: #2e7d32;
            border: 2px solid #a5d6a7;
            border-radius: 8px;
            box-shadow: 0 4px 0 #1b5e20;
            cursor: pointer;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1b5e20;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <button class="btn" id="soundBtn">効果音ボタン 🔊</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ==========================================
        // 1. ボタンを押した時の効果音（Web Audio API）
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSE(freq = 600, duration = 0.08) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq + 200, audioCtx.currentTime + duration);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        document.getElementById('soundBtn').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            playSE(800, 0.1);
        });

        // ==========================================
        // 2. ステータスバランス調整
        // ==========================================
        // 弱体化したゾンビ
        const ZOMBIE_STATS = { hp: 30, maxHp: 30, attack: 4, speed: 1.0, radius: 16 };
        
        // 強化された人間NPC
        const NPC_STATS = { hp: 150, maxHp: 150, attack: 25, speed: 2.2, radius: 16, detectRange: 250 };

        // プレイヤー
        const player = { x: 150, y: 200, radius: 16, hp: 100, maxHp: 100, speed: 3.0, angle: 0, isWalking: false };

        let zombies = [
            { x: 550, y: 180, hp: ZOMBIE_STATS.hp, cooldown: 0 },
            { x: 600, y: 380, hp: ZOMBIE_STATS.hp, cooldown: 0 }
        ];

        let npcs = [
            { x: 250, y: 300, hp: NPC_STATS.hp, cooldown: 0 }
        ];

        // 障害物（壁）
        const obstacles = [
            { x: 320, y: 120, w: 100, h: 220 },
            { x: 180, y: 420, w: 280, h: 60 }
        ];

        // ==========================================
        // 3. 障害物のすり抜け防止（判定と移動制限）
        // ==========================================
        function isCollidingWithWalls(x, y, radius) {
            for (let wall of obstacles) {
                let closestX = Math.max(wall.x, Math.min(x, wall.x + wall.w));
                let closestY = Math.max(wall.y, Math.min(y, wall.y + wall.h));
                let distX = x - closestX;
                let distY = y - closestY;
                if ((distX * distX + distY * distY) < (radius * radius)) {
                    return true;
                }
            }
            return false;
        }

        function moveEntity(entity, dx, dy) {
            // X軸方向の衝突チェック
            if (!isCollidingWithWalls(entity.x + dx, entity.y, entity.radius)) {
                entity.x += dx;
            }
            // Y軸方向の衝突チェック
            if (!isCollidingWithWalls(entity.x, entity.y + dy, entity.radius)) {
                entity.y += dy;
            }
        }

        // ==========================================
        // 4. 操作系（十字キー ＋ タッチ歩き ＆ マイクラ風「はたく」丸UI）
        // ==========================================
        const dpad = { x: 100, size: 60 }; // 左下に配置
        let dpadInput = { x: 0, y: 0 };

        let touchDpadId = null;
        let touchWalkId = null;

        let hitRing = { active: false, x: 0, y: 0, progress: 0 };

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const dpadY = canvas.height - 120;

            for (let t of e.changedTouches) {
                // 十字キー領域のタッチ
                let distToDpad = Math.hypot(t.clientX - dpad.x, t.clientY - dpadY);
                if (distToDpad < 80 && touchDpadId === null) {
                    touchDpadId = t.identifier;
                    updateDpadInput(t.clientX, t.clientY, dpadY);
                    continue;
                }

                // 画面タッチ操作（タッチした方向に向きを変えて歩く ＋ マイクラ風「はたく」丸）
                if (touchWalkId === null) {
                    touchWalkId = t.identifier;
                    updateTouchWalk(t.clientX, t.clientY);

                    hitRing = { active: true, x: t.clientX, y: t.clientY, progress: 0 };
                    playSE(900, 0.05);

                    attackAtPosition(t.clientX, t.clientY);
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const dpadY = canvas.height - 120;

            for (let t of e.changedTouches) {
                if (t.identifier === touchDpadId) {
                    updateDpadInput(t.clientX, t.clientY, dpadY);
                }
                if (t.identifier === touchWalkId) {
                    updateTouchWalk(t.clientX, t.clientY);
                    hitRing.x = t.clientX;
                    hitRing.y = t.clientY;
                }
            }
        }, { passive: false });

        const handleTouchEnd = (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === touchDpadId) {
                    touchDpadId = null;
                    dpadInput = { x: 0, y: 0 };
                }
                if (t.identifier === touchWalkId) {
                    touchWalkId = null;
                    player.isWalking = false;
                    hitRing.active = false;
                }
            }
        };
        canvas.addEventListener('touchend', handleTouchEnd);
        canvas.addEventListener('touchcancel', handleTouchEnd);

        function updateDpadInput(tx, ty, dpadY) {
            let dx = tx - dpad.x;
            let dy = ty - dpadY;
            let dist = Math.hypot(dx, dy);
            if (dist > 10) {
                dpadInput.x = dx / dist;
                dpadInput.y = dy / dist;
                player.angle = Math.atan2(dy, dx);
            } else {
                dpadInput = { x: 0, y: 0 };
            }
        }

        function updateTouchWalk(tx, ty) {
            let dx = tx - player.x;
            let dy = ty - player.y;
            if (Math.hypot(dx, dy) > 15) {
                player.angle = Math.atan2(dy, dx);
                player.isWalking = true;
            }
        }

        function attackAtPosition(tx, ty) {
            zombies.forEach(zombie => {
                let dist = Math.hypot(zombie.x - tx, zombie.y - ty);
                if (dist < 50) {
                    zombie.hp -= 20;
                    playSE(300, 0.1);
                }
            });
        }

        // ==========================================
        // 5. ゲームロジックの更新
        // ==========================================
        function update() {
            // --- プレイヤー移動（十字キー または タッチ歩き）---
            let mx = 0;
            let my = 0;

            if (dpadInput.x !== 0 || dpadInput.y !== 0) {
                mx = dpadInput.x * player.speed;
                my = dpadInput.y * player.speed;
            } else if (player.isWalking) {
                mx = Math.cos(player.angle) * player.speed;
                my = Math.sin(player.angle) * player.speed;
            }

            if (mx !== 0 || my !== 0) {
                moveEntity(player, mx, my);
            }

            // --- 強化された人間NPCのAI ---
            npcs.forEach(npc => {
                if (npc.cooldown > 0) npc.cooldown--;

                let targetZombie = null;
                let minDist = NPC_STATS.detectRange;

                zombies.forEach(zombie => {
                    let d = Math.hypot(zombie.x - npc.x, zombie.y - npc.y);
                    if (d < minDist) {
                        minDist = d;
                        targetZombie = zombie;
                    }
                });

                if (targetZombie) {
                    let angle = Math.atan2(targetZombie.y - npc.y, targetZombie.x - npc.x);
                    moveEntity(npc, Math.cos(angle) * NPC_STATS.speed, Math.sin(angle) * NPC_STATS.speed);

                    if (minDist < 35 && npc.cooldown === 0) {
                        targetZombie.hp -= NPC_STATS.attack;
                        npc.cooldown = 20; // 攻撃間隔を短く強化
                        playSE(500, 0.05);
                    }
                }
            });

            // --- 弱体化したゾンビのAI ---
            zombies.forEach(zombie => {
                if (zombie.cooldown > 0) zombie.cooldown--;

                let targets = [player, ...npcs];
                let nearestTarget = targets.reduce((prev, curr) => {
                    let distPrev = Math.hypot(prev.x - zombie.x, prev.y - zombie.y);
                    let distCurr = Math.hypot(curr.x - zombie.x, curr.y - zombie.y);
                    return (distCurr < distPrev) ? curr : prev;
                });

                let dist = Math.hypot(nearestTarget.x - zombie.x, nearestTarget.y - zombie.y);
                let angle = Math.atan2(nearestTarget.y - zombie.y, nearestTarget.x - zombie.x);

                moveEntity(zombie, Math.cos(angle) * ZOMBIE_STATS.speed, Math.sin(angle) * ZOMBIE_STATS.speed);

                if (dist < 32 && zombie.cooldown === 0) {
                    nearestTarget.hp -= ZOMBIE_STATS.attack;
                    zombie.cooldown = 60;
                }
            });

            zombies = zombies.filter(z => z.hp > 0);
            npcs = npcs.filter(n => n.hp > 0);
        }

        // ==========================================
        // 6. 描画処理
        // ==========================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 障害物（壁）
            ctx.fillStyle = '#424242';
            ctx.strokeStyle = '#616161';
            ctx.lineWidth = 4;
            obstacles.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            });

            // 人間NPC
            npcs.forEach(npc => drawCharacter(npc, '#00bcd4', 'NPC', npc.hp, NPC_STATS.maxHp));

            // ゾンビ
            zombies.forEach(zombie => drawCharacter(zombie, '#4caf50', 'ゾンビ', zombie.hp, ZOMBIE_STATS.maxHp));

            // プレイヤー
            drawCharacter(player, '#2196f3', 'プレイヤー', player.hp, player.maxHp);

            // 十字キーUI (画面左下)
            const dpadY = canvas.height - 120;
            ctx.save();
            ctx.translate(dpad.x, dpadY);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.arc(0, 0, 60, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(-12, -45, 24, 90);
            ctx.fillRect(-45, -12, 90, 24);
            ctx.restore();

            // マイクラ風「はたく」丸エフェクト
            if (hitRing.active) {
                hitRing.progress += 0.1;
                if (hitRing.progress > 1) hitRing.progress = 0;

                ctx.save();
                ctx.beginPath();
                ctx.arc(hitRing.x, hitRing.y, 28, 0, Math.PI * 2 * hitRing.progress);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawCharacter(char, color, label, hp, maxHp) {
            ctx.save();
            ctx.translate(char.x, char.y);

            ctx.beginPath();
            ctx.arc(0, 0, char.radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (char.angle !== undefined) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(char.angle) * 22, Math.sin(char.angle) * 22);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(-20, -26, 40, 5);
            ctx.fillStyle = hp > maxHp * 0.3 ? '#4caf50' : '#f44336';
            ctx.fillRect(-20, -26, (hp / maxHp) * 40, 5);

            ctx.fillStyle = '#fff';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(label, 0, -30);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
