<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Survival Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #1e1e1e;
            font-family: sans-serif;
        }
        #gameCanvas {
            display: block;
            touch-action: none;
        }
        /* UIボタンのスタイル */
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
        }
        .btn {
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #2e7d32;
            border: 2px solid #a5d6a7;
            border-radius: 8px;
            box-shadow: 0 4px 0 #1b5e20;
            cursor: pointer;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1b5e20;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <button class="btn" id="seButton">ボタン効果音 🔊</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 画面サイズ調整
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ==========================================
        // 1. 効果音（Web Audio API）
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSE(freq = 600, duration = 0.08) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq + 200, audioCtx.currentTime + duration);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // ボタンのクリック時に効果音を鳴らす
        document.getElementById('seButton').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            playSE(700, 0.1);
        });

        // ==========================================
        // 2. ステータスバランス調整
        // ==========================================
        // 弱体化したゾンビ
        const ZOMBIE_STATS = { hp: 30, maxHp: 30, attack: 5, speed: 1.2, radius: 16 };
        
        // 強化された人間NPC
        const NPC_STATS = { hp: 120, maxHp: 120, attack: 25, speed: 2.2, radius: 16, detectRange: 200 };

        // プレイヤー
        const player = { x: 150, y: 200, radius: 16, hp: 100, maxHp: 100, speed: 3.2, angle: 0 };

        // キャラクター配列
        let zombies = [
            { x: 500, y: 200, hp: ZOMBIE_STATS.hp, cooldown: 0 },
            { x: 600, y: 350, hp: ZOMBIE_STATS.hp, cooldown: 0 }
        ];

        let npcs = [
            { x: 250, y: 300, hp: NPC_STATS.hp, cooldown: 0 }
        ];

        // 障害物（壁）
        const obstacles = [
            { x: 300, y: 100, w: 120, h: 200 },
            { x: 150, y: 400, w: 300, h: 60 }
        ];

        // ==========================================
        // 3. 障害物のすり抜け防止（当たり判定）
        // ==========================================
        function isCollidingWithWalls(x, y, radius) {
            for (let wall of obstacles) {
                let closestX = Math.max(wall.x, Math.min(x, wall.x + wall.w));
                let closestY = Math.max(wall.y, Math.min(y, wall.y + wall.h));
                let distX = x - closestX;
                let distY = y - closestY;
                if ((distX * distX + distY * distY) < (radius * radius)) {
                    return true; // 衝突あり
                }
            }
            return false;
        }

        function moveEntity(entity, dx, dy) {
            // X方向への移動チェック
            if (!isCollidingWithWalls(entity.x + dx, entity.y, entity.radius)) {
                entity.x += dx;
            }
            // Y方向への移動チェック
            if (!isCollidingWithWalls(entity.x, entity.y + dy, entity.radius)) {
                entity.y += dy;
            }
        }

        // ==========================================
        // 4. タッチ操作UI（ジョイスティック ＆ はたく丸エフェクト）
        // ==========================================
        let touchMoveId = null;
        let touchActionId = null;

        let joystick = { active: false, startX: 0, startY: 0, currX: 0, currY: 0 };
        let hitRing = { active: false, x: 0, y: 0, progress: 0 };

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let t of e.changedTouches) {
                // 画面左半分：移動用バーチャル十字キー
                if (t.clientX < canvas.width / 2 && touchMoveId === null) {
                    touchMoveId = t.identifier;
                    joystick = { active: true, startX: t.clientX, startY: t.clientY, currX: t.clientX, currY: t.clientY };
                } 
                // 画面右半分：荒野行動風タッチ操作 ＆ マイクラ風「はたく」丸エフェクト
                else if (t.clientX >= canvas.width / 2) {
                    touchActionId = t.identifier;
                    hitRing = { active: true, x: t.clientX, y: t.clientY, progress: 0 };
                    playSE(900, 0.05); // 打撃音

                    // タッチした方向にプレイヤーが攻撃
                    player.angle = Math.atan2(t.clientY - player.y, t.clientX - player.x);
                    attackZombiesInFront();
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let t of e.changedTouches) {
                if (t.identifier === touchMoveId) {
                    joystick.currX = t.clientX;
                    joystick.currY = t.clientY;
                }
                if (t.identifier === touchActionId) {
                    hitRing.x = t.clientX;
                    hitRing.y = t.clientY;
                    player.angle = Math.atan2(t.clientY - player.y, t.clientX - player.x);
                }
            }
        }, { passive: false });

        const resetTouch = (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === touchMoveId) {
                    touchMoveId = null;
                    joystick.active = false;
                }
                if (t.identifier === touchActionId) {
                    touchActionId = null;
                    hitRing.active = false;
                }
            }
        };
        canvas.addEventListener('touchend', resetTouch);
        canvas.addEventListener('touchcancel', resetTouch);

        // プレイヤーの攻撃処理
        function attackZombiesInFront() {
            zombies.forEach(zombie => {
                let dist = Math.hypot(zombie.x - player.x, zombie.y - player.y);
                if (dist < 60) {
                    zombie.hp -= 20;
                    playSE(300, 0.1); // ダメージ音
                }
            });
        }

        // ==========================================
        // 5. ゲームループ＆更新処理
        // ==========================================
        function update() {
            // --- プレイヤー移動処理 ---
            if (joystick.active) {
                let dx = joystick.currX - joystick.startX;
                let dy = joystick.currY - joystick.startY;
                let dist = Math.hypot(dx, dy);

                if (dist > 5) {
                    let angle = Math.atan2(dy, dx);
                    if (!touchActionId) player.angle = angle; // 攻撃中でなければ移動方向を向く
                    let moveX = Math.cos(angle) * player.speed;
                    let moveY = Math.sin(angle) * player.speed;
                    moveEntity(player, moveX, moveY);
                }
            }

            // --- 人間NPCのAI更新 ---
            npcs.forEach(npc => {
                if (npc.cooldown > 0) npc.cooldown--;

                // 一番近いゾンビを探す
                let targetZombie = null;
                let minDist = NPC_STATS.detectRange;

                zombies.forEach(zombie => {
                    let d = Math.hypot(zombie.x - npc.x, zombie.y - npc.y);
                    if (d < minDist) {
                        minDist = d;
                        targetZombie = zombie;
                    }
                });

                if (targetZombie) {
                    // ゾンビに向かって移動
                    let angle = Math.atan2(targetZombie.y - npc.y, targetZombie.x - npc.x);
                    moveEntity(npc, Math.cos(angle) * NPC_STATS.speed, Math.sin(angle) * NPC_STATS.speed);

                    // 攻撃範囲内なら攻撃（強いNPCがゾンビを倒す）
                    if (minDist < 35 && npc.cooldown === 0) {
                        targetZombie.hp -= NPC_STATS.attack;
                        npc.cooldown = 30; // 0.5秒ごとに攻撃
                        playSE(500, 0.05);
                    }
                }
            });

            // --- ゾンビのAI更新 ---
            zombies.forEach(zombie => {
                if (zombie.cooldown > 0) zombie.cooldown--;

                // 一番近い人間（プレイヤーまたはNPC）を狙う
                let targets = [player, ...npcs];
                let nearestTarget = targets.reduce((prev, curr) => {
                    let distPrev = Math.hypot(prev.x - zombie.x, prev.y - zombie.y);
                    let distCurr = Math.hypot(curr.x - zombie.x, curr.y - zombie.y);
                    return (distCurr < distPrev) ? curr : prev;
                });

                let dist = Math.hypot(nearestTarget.x - zombie.x, nearestTarget.y - zombie.y);
                let angle = Math.atan2(nearestTarget.y - zombie.y, nearestTarget.x - zombie.x);

                // 弱体化したゾンビの遅い移動
                moveEntity(zombie, Math.cos(angle) * ZOMBIE_STATS.speed, Math.sin(angle) * ZOMBIE_STATS.speed);

                // 攻撃（攻撃力が低い）
                if (dist < 32 && zombie.cooldown === 0) {
                    nearestTarget.hp -= ZOMBIE_STATS.attack;
                    zombie.cooldown = 50;
                }
            });

            // 死亡処理（HPが0以下になったら除外）
            zombies = zombies.filter(z => z.hp > 0);
            npcs = npcs.filter(n => n.hp > 0);
        }

        // ==========================================
        // 6. 描画処理
        // ==========================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- 障害物（壁）描画 ---
            ctx.fillStyle = '#424242';
            ctx.strokeStyle = '#616161';
            ctx.lineWidth = 4;
            obstacles.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            });

            // --- 人間NPC描画 (青緑色) ---
            npcs.forEach(npc => drawCharacter(npc, '#00bcd4', 'NPC', npc.hp, NPC_STATS.maxHp));

            // --- ゾンビ描画 (緑色) ---
            zombies.forEach(zombie => drawCharacter(zombie, '#4caf50', 'ゾンビ', zombie.hp, ZOMBIE_STATS.maxHp));

            // --- プレイヤー描画 (青色) ---
            drawCharacter(player, '#2196f3', 'プレイヤー', player.hp, player.maxHp);

            // --- 移動用ジョイスティックUI ---
            if (joystick.active) {
                ctx.beginPath();
                ctx.arc(joystick.startX, joystick.startY, 50, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(joystick.currX, joystick.currY, 25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
            }

            // --- マイクラ風「はたく」丸い円形エフェクト ---
            if (hitRing.active) {
                hitRing.progress += 0.08;
                if (hitRing.progress > 1) hitRing.progress = 0;

                ctx.save();
                ctx.beginPath();
                ctx.arc(hitRing.x, hitRing.y, 30, 0, Math.PI * 2 * hitRing.progress);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.restore();
            }
        }

        // キャラクター共通描画関数
        function drawCharacter(char, color, label, hp, maxHp) {
            ctx.save();
            ctx.translate(char.x, char.y);

            // 本体
            ctx.beginPath();
            ctx.arc(0, 0, char.radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 向きの線
            if (char.angle !== undefined) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(char.angle) * 22, Math.sin(char.angle) * 22);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // HPバー
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-20, -28, 40, 6);
            ctx.fillStyle = hp > maxHp * 0.3 ? '#4caf50' : '#f44336';
            ctx.fillRect(-20, -28, (hp / maxHp) * 40, 6);

            // 名前の表示
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(label, 0, -32);

            ctx.restore();
        }

        // メインループ
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
