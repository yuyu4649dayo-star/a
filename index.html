<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Zombie 5v5 Survival</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            user-select: none; -webkit-user-select: none;
            touch-action: none; /* 画面のスクロール・ズレを完全にシャットアウト */
        }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            position: fixed; top: 0; left: 0;
            background: #000; font-family: sans-serif;
        }
        
        /* 1. 陣営選択画面 */
        #select-screen {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, #111 0%, #220000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; color: #fff;
        }
        #select-screen h1 { font-size: 32px; margin-bottom: 30px; letter-spacing: 2px; text-shadow: 0 0 10px #f00; }
        .team-btns { display: flex; gap: 20px; }
        .team-btn {
            padding: 20px 30px; font-size: 20px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer;
            transition: transform 0.2s; color: #fff;
        }
        .team-btn:active { transform: scale(0.95); }
        .btn-human { background: #1e88e5; box-shadow: 0 0 15px #1e88e5; }
        .btn-zombie { background: #e53935; box-shadow: 0 0 15px #e53935; }

        /* 2. ロード画面 */
        #loading-screen {
            position: absolute; width: 100%; height: 100%; background: #0a0a0a;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 90; color: #fff;
        }
        .progress-bar-bg { width: 250px; height: 15px; background: #333; border-radius: 8px; overflow: hidden; margin-top: 15px; }
        .progress-bar { width: 0%; height: 100%; background: #4caf50; transition: width 0.1s; }

        /* 3. ゲームHUD */
        #game-hud { position: absolute; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 10; }
        .hud-top { position: absolute; top: 15px; left: 15px; color: #fff; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 3px #000; }
        
        /* 視覚的 十字キー（ジョイスティック）UI */
        #dpad-base {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; pointer-events: auto;
        }
        #dpad-knob {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.05s ease-out;
        }

        .action-btns { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .act-btn {
            padding: 12px 20px; font-size: 16px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.6);
            border: 2px solid #fff; border-radius: 30px; cursor: pointer;
        }
        .act-btn:active { background: rgba(255,255,255,0.4); }

        /* マイクラ風はたく丸UI Canvas */
        #fxCanvas { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 20; }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 1. 陣営選択 -->
    <div id="select-screen">
        <h1>BATTLE 5vs5</h1>
        <div class="team-btns">
            <button class="team-btn btn-human" onclick="selectTeam('human')">人間陣営で参戦</button>
            <button class="team-btn btn-zombie" onclick="selectTeam('zombie')">ゾンビ陣営で参戦</button>
        </div>
    </div>

    <!-- 2. ロード画面 -->
    <div id="loading-screen">
        <h2>LOADING MAP...</h2>
        <div class="progress-bar-bg"><div class="progress-bar" id="pBar"></div></div>
    </div>

    <!-- 3. ゲームHUD -->
    <div id="game-hud">
        <div class="hud-top">
            <div id="teamInfo">陣営: -</div>
            <div id="hpInfo">HP: 100</div>
            <div id="ammoInfo">弾薬: -</div>
        </div>

        <!-- 画面左下のバーチャル十字キーUI -->
        <div id="dpad-base">
            <div id="dpad-knob"></div>
        </div>

        <div class="action-btns" id="actionContainer"></div>
    </div>

    <canvas id="fxCanvas"></canvas>

    <script>
        // ブラウザのタッチスワイプでの画面ズレ防止
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        // --- 効果音再生 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSE(freq = 600, type = 'sine', duration = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // --- ゲームステート ---
        let playerTeam = 'human';
        let scene, camera, renderer;
        let player, playerBody, gunMesh, muzzleFlash;
        let entities = [];
        let ammoBoxes = [];
        let obstacles = [];
        
        let playerStats = { hp: 100, maxHp: 100, ammo: 10, reserveAmmo: 20, isStunned: false, stunTimer: 0 };
        let cameraAngleY = 0, cameraAngleX = 0.3;

        // 銃のリコイル・発射エフェクト用
        let recoilZ = 0;
        let muzzleFlashTimer = 0;

        // タッチ操作用
        let dpadInput = { x: 0, y: 0 };
        let touchDpadId = null, touchLookId = null;
        let lastTouchX = 0, lastTouchY = 0;
        let hitRing = { active: false, x: 0, y: 0, progress: 0 };

        // 1. 陣営選択 ＆ ロード画面
        function selectTeam(team) {
            playSE(800, 'square', 0.15);
            playerTeam = team;
            document.getElementById('select-screen').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'flex';

            let pBar = document.getElementById('pBar');
            let progress = 0;
            let timer = setInterval(() => {
                progress += 20;
                pBar.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(timer);
                    document.getElementById('loading-screen').style.display = 'none';
                    initGame();
                }
            }, 100);
        }

        // 2. 3Dゲーム初期化
        function initGame() {
            document.getElementById('game-hud').style.display = 'block';
            document.getElementById('teamInfo').innerText = `陣営: ${playerTeam === 'human' ? '人間' : 'ゾンビ'}`;
            setupHUDButtons();

            // Three.js シーン
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111115);
            scene.fog = new THREE.FogExp2(0x111115, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // ライト
            const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // 床
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222225 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 障害物配置（引っかかりにくい柱構造に変更）
            createObstacles();

            // 散らばる弾薬箱（2個）
            createAmmoBoxes();

            // 5vs5 キャラクター生成
            spawnEntities();

            // タッチ操作設定
            setupTouchControls();

            // リサイズ対応
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        // 3. 障害物の配置（引っかかりを防ぐためにサイズ調整）
        function createObstacles() {
            const obsData = [
                { x: -8, z: 0, w: 4, h: 4, d: 4 },
                { x: 8, z: 0, w: 4, h: 4, d: 4 },
                { x: 0, z: -12, w: 10, h: 4, d: 3 },
                { x: 0, z: 12, w: 10, h: 4, d: 3 }
            ];
            const mat = new THREE.MeshStandardMaterial({ color: 0x444450 });

            obsData.forEach(data => {
                const geo = new THREE.BoxGeometry(data.w, data.h, data.d);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(data.x, data.h / 2, data.z);
                scene.add(mesh);

                mesh.geometry.computeBoundingBox();
                obstacles.push({
                    box: new THREE.Box3().setFromObject(mesh),
                    mesh: mesh
                });
            });
        }

        // 散らばる弾薬箱
        function createAmmoBoxes() {
            const mat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
            const positions = [{ x: -4, z: -2 }, { x: 4, z: 2 }];
            positions.forEach(pos => {
                const geo = new THREE.BoxGeometry(0.8, 0.6, 0.8);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(pos.x, 0.3, pos.z);
                scene.add(mesh);
                ammoBoxes.push(mesh);
            });
        }

        // 5vs5 スポーン処理
        function spawnEntities() {
            const humanMat = new THREE.MeshStandardMaterial({ color: 0x2196f3 });
            const zombieMat = new THREE.MeshStandardMaterial({ color: 0x4caf50 });

            const isPlayerHuman = (playerTeam === 'human');
            const pGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8);
            
            // プレイヤー生成
            playerBody = new THREE.Mesh(pGeo, isPlayerHuman ? humanMat : zombieMat);
            playerBody.position.set(0, 0.9, 15);
            scene.add(playerBody);

            if (isPlayerHuman) attachGunToPlayer();

            player = {
                mesh: playerBody, isPlayer: true, team: playerTeam,
                hp: 100, maxHp: 100, speed: 0.12, stunTimer: 0
            };
            entities.push(player);

            // NPC (味方4体 + 敵5体)
            for (let i = 0; i < 9; i++) {
                const isHuman = (i < 4) ? isPlayerHuman : !isPlayerHuman;
                const mesh = new THREE.Mesh(pGeo, isHuman ? humanMat : zombieMat);
                
                // 出現位置
                const spawnZ = isHuman ? 10 + Math.random()*4 : -10 - Math.random()*4;
                const spawnX = (Math.random() - 0.5) * 16;
                mesh.position.set(spawnX, 0.9, spawnZ);
                scene.add(mesh);

                entities.push({
                    mesh: mesh, isPlayer: false, team: isHuman ? 'human' : 'zombie',
                    hp: isHuman ? 120 : 60, maxHp: isHuman ? 120 : 60,
                    speed: isHuman ? 0.08 : 0.09, cooldown: 0, stunTimer: 0
                });
            }
        }

        // プレイヤーに銃を装着
        function attachGunToPlayer() {
            const gunGroup = new THREE.Group();
            
            const gunBodyGeo = new THREE.BoxGeometry(0.12, 0.18, 0.5);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const gunBody = new THREE.Mesh(gunBodyGeo, gunMat);
            gunGroup.add(gunBody);

            const flashGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
            muzzleFlash.position.set(0, 0.05, 0.35);
            muzzleFlash.visible = false;
            gunGroup.add(muzzleFlash);

            gunGroup.position.set(0.35, 0.2, 0.4);
            playerBody.add(gunGroup);
            gunMesh = gunGroup;
        }

        // HUDボタン生成
        function setupHUDButtons() {
            const container = document.getElementById('actionContainer');
            container.innerHTML = '';

            if (playerTeam === 'human') {
                container.innerHTML = `
                    <button class="act-btn" onclick="humanShoot()">射撃 🔫</button>
                    <button class="act-btn" onclick="humanReload()">リロード 🔄</button>
                    <button class="act-btn" onclick="humanPunch()">殴り 👊</button>
                    <button class="act-btn" onclick="humanKick()">蹴り 🦶</button>
                `;
            } else {
                container.innerHTML = `
                    <button class="act-btn" onclick="zombieBite()">噛みつき 🦷</button>
                    <button class="act-btn" onclick="zombieScratch()">引っ掻き 爪</button>
                    <button class="act-btn" onclick="zombieRoar()">叫び（スタン） 🗣️</button>
                `;
            }
        }

        // 当たり判定（障害物すり抜け防止）
        function checkObstacleCollision(newPos, radius = 0.5) {
            for (let obs of obstacles) {
                const box = obs.box;
                const closestX = Math.max(box.min.x, Math.min(newPos.x, box.max.x));
                const closestZ = Math.max(box.min.z, Math.min(newPos.z, box.max.z));
                const distX = newPos.x - closestX;
                const distZ = newPos.z - closestZ;
                if ((distX * distX + distZ * distZ) < (radius * radius)) {
                    return true;
                }
            }
            return false;
        }

        // プレイヤーの移動処理（カメラ方向に準拠した正しい前進・後退）
        function movePlayer() {
            if (player.stunTimer > 0) return;

            if (Math.abs(dpadInput.x) > 0.05 || Math.abs(dpadInput.y) > 0.05) {
                // カメラの見ている方向を計算
                const forwardX = -Math.sin(cameraAngleY);
                const forwardZ = -Math.cos(cameraAngleY);
                const rightX = Math.cos(cameraAngleY);
                const rightZ = -Math.sin(cameraAngleY);

                // スティックの入力からワールド移動量を算出 (dpadInput.y < 0 が前進)
                const moveX = (rightX * dpadInput.x - forwardX * dpadInput.y) * player.speed;
                const moveZ = (rightZ * dpadInput.x - forwardZ * dpadInput.y) * player.speed;

                // X軸・Z軸それぞれ壁滑り移動チェック
                let nextPos = player.mesh.position.clone();
                nextPos.x += moveX;
                if (!checkObstacleCollision(nextPos)) player.mesh.position.x = nextPos.x;

                nextPos = player.mesh.position.clone();
                nextPos.z += moveZ;
                if (!checkObstacleCollision(nextPos)) player.mesh.position.z = nextPos.z;

                // 進行方向を向く
                player.mesh.rotation.y = Math.atan2(moveX, moveZ);
            }
        }

        // 射撃（反動・エフェクト付き）
        function humanShoot() {
            if (playerStats.ammo <= 0) { playSE(200, 'sawtooth', 0.1); return; }
            playerStats.ammo--;
            playSE(900, 'square', 0.08);
            updateHUD();

            recoilZ = 0.25;
            if (muzzleFlash) { muzzleFlash.visible = true; muzzleFlashTimer = 3; }
            createBulletTracer();

            entities.forEach(e => {
                if (e.team !== 'human' && e.hp > 0) {
                    const dist = player.mesh.position.distanceTo(e.mesh.position);
                    if (dist < 15) e.hp -= 25;
                }
            });
        }

        function createBulletTracer() {
            const start = player.mesh.position.clone().add(new THREE.Vector3(0, 1.1, 0));
            const dir = new THREE.Vector3(Math.sin(player.mesh.rotation.y), 0, Math.cos(player.mesh.rotation.y));
            const end = start.clone().add(dir.multiplyScalar(15));

            const points = [start, end];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: 0xffea00 });
            const line = new THREE.Line(geo, mat);
            scene.add(line);
            setTimeout(() => scene.remove(line), 50);
        }

        function humanReload() {
            if (playerStats.reserveAmmo <= 0 || playerStats.ammo >= 10) return;
            playSE(400, 'sine', 0.2);
            const needed = 10 - playerStats.ammo;
            const load = Math.min(needed, playerStats.reserveAmmo);
            playerStats.ammo += load;
            playerStats.reserveAmmo -= load;
            updateHUD();
        }

        function humanPunch() { playSE(500, 'triangle', 0.1); meleeAttack(15, 2.5); }
        function humanKick() { playSE(300, 'triangle', 0.15); meleeAttack(25, 3.0); }

        function zombieBite() { playSE(250, 'sawtooth', 0.15); meleeAttack(30, 2.0); }
        function zombieScratch() { playSE(400, 'sawtooth', 0.1); meleeAttack(18, 2.5); }
        
        function zombieRoar() {
            playSE(150, 'sawtooth', 0.4);
            entities.forEach(e => {
                if (e.team === 'human' && e.hp > 0) {
                    if (player.mesh.position.distanceTo(e.mesh.position) < 8) {
                        e.stunTimer = 90;
                    }
                }
            });
        }

        function meleeAttack(dmg, range) {
            entities.forEach(e => {
                if (e.team !== playerTeam && e.hp > 0) {
                    if (player.mesh.position.distanceTo(e.mesh.position) < range) e.hp -= dmg;
                }
            });
        }

        // タッチ操作 ＆ バーチャル十字キー（UI更新付き）
        function setupTouchControls() {
            const dpadBase = document.getElementById('dpad-base');
            const dpadKnob = document.getElementById('dpad-knob');

            window.addEventListener('touchstart', (e) => {
                for (let t of e.changedTouches) {
                    // 左側：十字キー
                    if (t.clientX < window.innerWidth / 2 && touchDpadId === null) {
                        touchDpadId = t.identifier;
                        updateDpadUI(t.clientX, t.clientY);
                    } 
                    // 右側：視点・攻撃エフェクト
                    else if (t.clientX >= window.innerWidth / 2 && touchLookId === null) {
                        touchLookId = t.identifier;
                        lastTouchX = t.clientX; lastTouchY = t.clientY;
                        hitRing = { active: true, x: t.clientX, y: t.clientY, progress: 0 };
                        playSE(700, 'sine', 0.05);
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === touchDpadId) updateDpadUI(t.clientX, t.clientY);
                    if (t.identifier === touchLookId) {
                        let dx = t.clientX - lastTouchX;
                        let dy = t.clientY - lastTouchY;
                        cameraAngleY -= dx * 0.005;
                        cameraAngleX = Math.max(0.1, Math.min(1.0, cameraAngleX + dy * 0.005));
                        lastTouchX = t.clientX; lastTouchY = t.clientY;
                        hitRing.x = t.clientX; hitRing.y = t.clientY;
                    }
                }
            }, { passive: false });

            const resetTouch = (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === touchDpadId) {
                        touchDpadId = null;
                        dpadInput = { x: 0, y: 0 };
                        dpadKnob.style.transform = `translate(0px, 0px)`;
                    }
                    if (t.identifier === touchLookId) { touchLookId = null; hitRing.active = false; }
                }
            };
            window.addEventListener('touchend', resetTouch);
            window.addEventListener('touchcancel', resetTouch);
        }

        // 十字キーUIの表示更新と入力計算
        function updateDpadUI(tx, ty) {
            const dpadBase = document.getElementById('dpad-base').getBoundingClientRect();
            const centerX = dpadBase.left + dpadBase.width / 2;
            const centerY = dpadBase.top + dpadBase.height / 2;

            let dx = tx - centerX;
            let dy = ty - centerY;
            let dist = Math.hypot(dx, dy);
            const maxRadius = 40;

            if (dist > 0) {
                let clampDist = Math.min(dist, maxRadius);
                let knobX = (dx / dist) * clampDist;
                let knobY = (dy / dist) * clampDist;
                
                // スティックUIを指の位置に動かす
                document.getElementById('dpad-knob').style.transform = `translate(${knobX}px, ${knobY}px)`;

                dpadInput.x = dx / maxRadius;
                dpadInput.y = dy / maxRadius;
            }
        }

        // --- メインループ ---
        function animate() {
            requestAnimationFrame(animate);

            if (player.stunTimer > 0) player.stunTimer--;
            movePlayer();

            // リコイル復元
            if (recoilZ > 0) recoilZ = THREE.MathUtils.lerp(recoilZ, 0, 0.2);
            if (gunMesh) {
                gunMesh.position.z = 0.4 - recoilZ;
                gunMesh.rotation.x = recoilZ * 1.5;
            }

            if (muzzleFlashTimer > 0) {
                muzzleFlashTimer--;
                if (muzzleFlashTimer <= 0 && muzzleFlash) muzzleFlash.visible = false;
            }

            // 弾薬箱取得
            ammoBoxes.forEach((box, idx) => {
                if (player.mesh.position.distanceTo(box.position) < 1.2) {
                    playerStats.reserveAmmo += 10;
                    playSE(800, 'sine', 0.15);
                    scene.remove(box);
                    ammoBoxes.splice(idx, 1);
                    updateHUD();
                }
            });

            // NPC AI動作（追従・戦闘）
            updateNPCs();

            // カメラ位置更新（三人称追従）
            const camDist = 6;
            camera.position.x = player.mesh.position.x + Math.sin(cameraAngleY) * camDist * Math.cos(cameraAngleX);
            camera.position.y = player.mesh.position.y + Math.sin(cameraAngleX) * camDist + 1;
            camera.position.z = player.mesh.position.z + Math.cos(cameraAngleY) * camDist * Math.cos(cameraAngleX);
            camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1, player.mesh.position.z);

            renderer.render(scene, camera);
            drawFX();
            updateHUD();
        }

        // NPC AI（障害物を避けてターゲットへ進む）
        function updateNPCs() {
            entities.forEach(e => {
                if (e.isPlayer || e.hp <= 0) return;
                if (e.stunTimer > 0) { e.stunTimer--; return; }

                if (e.cooldown > 0) e.cooldown--;

                let target = null, minDist = 999;
                entities.forEach(other => {
                    if (other.team !== e.team && other.hp > 0) {
                        let d = e.mesh.position.distanceTo(other.mesh.position);
                        if (d < minDist) { minDist = d; target = other; }
                    }
                });

                if (target) {
                    let dir = target.mesh.position.clone().sub(e.mesh.position).normalize();
                    
                    // X軸とZ軸を個別に動かして壁引っかかり（スタック）を自動回避
                    let moveX = dir.x * e.speed;
                    let moveZ = dir.z * e.speed;

                    let nextX = e.mesh.position.clone(); nextX.x += moveX;
                    if (!checkObstacleCollision(nextX)) e.mesh.position.x = nextX.x;

                    let nextZ = e.mesh.position.clone(); nextZ.z += moveZ;
                    if (!checkObstacleCollision(nextZ)) e.mesh.position.z = nextZ.z;

                    e.mesh.rotation.y = Math.atan2(dir.x, dir.z);

                    // 攻撃
                    if (minDist < 2.2 && e.cooldown === 0) {
                        target.hp -= (e.team === 'human') ? 18 : 10;
                        e.cooldown = 35;
                    }
                }
            });
        }

        function updateHUD() {
            document.getElementById('hpInfo').innerText = `HP: ${Math.max(0, player.hp)}`;
            if (playerTeam === 'human') {
                document.getElementById('ammoInfo').innerText = `弾薬: ${playerStats.ammo} / ${playerStats.reserveAmmo}`;
            } else {
                document.getElementById('ammoInfo').innerText = `状態: ${player.stunTimer > 0 ? 'スタン中！' : '正常'}`;
            }
        }

        // マイクラ風はたく丸UI描画
        function drawFX() {
            const cvs = document.getElementById('fxCanvas');
            cvs.width = window.innerWidth; cvs.height = window.innerHeight;
            const ctx = cvs.getContext('2d');

            if (hitRing.active) {
                hitRing.progress += 0.08;
                if (hitRing.progress > 1) hitRing.progress = 0;
                ctx.beginPath();
                ctx.arc(hitRing.x, hitRing.y, 30, 0, Math.PI * 2 * hitRing.progress);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 5;
                ctx.stroke();
            }
        }
    </script>
</body>
</html>
